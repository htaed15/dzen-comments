services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [media:/app/media]

  celery:
    build: ./backend
    command: celery -A config worker -l info
    env_file: .env
    depends_on: [backend]
    volumes: [media:/app/media]

  frontend:
    build: ./frontend
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [backend]
    volumes: [media:/media:ro]

volumes:
  pgdata:
  media:
